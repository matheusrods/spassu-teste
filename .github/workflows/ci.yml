name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: livraria_test
          MYSQL_USER: symfony
          MYSQL_PASSWORD: symfony
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # dbname_suffix (config/packages/doctrine.yaml, when@test) acrescenta
      # "_test" sozinho — por isso aqui é "livraria", não "livraria_test".
      DATABASE_URL: mysql://symfony:symfony@127.0.0.1:3306/livraria?serverVersion=8.0&charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - name: Criar .env
        run: |
          cp .env.example .env
          sed -i "s/^APP_SECRET=.*/APP_SECRET=$(openssl rand -hex 16)/" .env

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip, bcmath, opcache
          coverage: none

      - name: Instalar dependências PHP (composer)
        run: composer install --no-progress --prefer-dist

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências e compilar assets (Webpack Encore)
        run: |
          npm ci
          npm run build

      - name: Rodar migrations no banco de teste
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Rodar testes (PHPUnit)
        run: php bin/phpunit --testdox
