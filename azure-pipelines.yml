trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  DATABASE_URL: 'mysql://symfony:symfony@127.0.0.1:3306/livraria_test?serverVersion=8.0&charset=utf8mb4'

steps:
  - task: UsePhpVersion@0
    inputs:
      versionSpec: '8.4'
      extensions: 'pdo_mysql, intl, zip, bcmath, opcache'
    displayName: 'Instalar PHP 8.4'

  - script: |
      docker run -d --name mysql \
        -e MYSQL_ROOT_PASSWORD=root \
        -e MYSQL_DATABASE=livraria_test \
        -e MYSQL_USER=symfony \
        -e MYSQL_PASSWORD=symfony \
        -p 3306:3306 mysql:8.0
      echo "Aguardando o MySQL ficar pronto..."
      for i in $(seq 1 30); do
        docker exec mysql mysqladmin ping -uroot -proot --silent && break
        sleep 2
      done
    displayName: 'Subir MySQL de teste'

  - script: composer install --no-progress --prefer-dist
    displayName: 'Instalar dependências PHP (composer)'

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Instalar Node.js'

  - script: |
      npm ci
      npm run build
    displayName: 'Instalar dependências e compilar assets (Webpack Encore)'

  - script: php bin/console doctrine:migrations:migrate --no-interaction --env=test
    displayName: 'Rodar migrations no banco de teste'

  - script: php bin/phpunit --testdox
    displayName: 'Rodar testes (PHPUnit)'
