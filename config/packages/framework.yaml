# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # O PHP-FPM nunca é exposto diretamente (só o Nginx é) — confiamos em
    # qualquer proxy porque, nesta topologia, "o proxy" é sempre o próprio
    # Nginx do docker-compose. Necessário para redirects/URLs absolutas
    # ficarem corretos atrás de um proxy reverso externo (ex.: túnel do
    # GitHub Codespaces), que envia esses headers com o host/proto reais.
    trusted_proxies: '0.0.0.0/0,::/0'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Note that the session will be started ONLY if you read or write from it.
    #
    # cookie_secure fixo em false: com trusted_proxies confiando em qualquer
    # origem para X-Forwarded-Proto (acima), uma requisição isolada com esse
    # header (ex.: vinda do túnel do Codespaces) fazia o cookie de sessão
    # nascer "secure" — e como o acesso local é http:// puro, o navegador
    # descartava esse cookie na requisição seguinte, deslogando no meio do
    # uso (ex.: excluir um livro e cair na tela de login). App local/demo,
    # sem necessidade real de cookie HTTPS-only.
    session:
        cookie_secure: false
        gc_maxlifetime: 14400

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
